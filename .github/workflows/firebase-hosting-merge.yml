# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools


name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-24.04

    steps:
      # 1. GitHubからコードを取得
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Flutterをインストール
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3. 依存パッケージを取得
      - name: Install dependencies
        run: flutter pub get

      # 4. Flutter Webをビルド
      - name: Build Flutter Web
        run: dart run tool/build_web.dart

      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check compiled Web app in Chrome
        run: node tool/check_web_release.mjs --local-build
        env:
          # Hosted Linux runners restrict Chrome sandbox namespaces.
          CHROME_NO_SANDBOX: "true"

      # 5. Firebase Hostingへ公開
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SIGHTSEEING_MATCHING_PROTOTYPE }}
          channelId: live
          projectId: sightseeing-matching-prototype

