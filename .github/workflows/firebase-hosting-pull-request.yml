name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart run tool/build_web.dart
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test Web smoke-check helpers
        run: node --test tool/check_web_release.test.mjs
      - name: Check compiled Web app in Chrome
        # Give headless Chrome an isolated, valid D-Bus session on Linux.
        run: dbus-run-session -- node tool/check_web_release.mjs --local-build
        env:
          # Hosted Linux runners restrict Chrome sandbox namespaces.
          CHROME_NO_SANDBOX: "true"

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{
            secrets.FIREBASE_SERVICE_ACCOUNT_SIGHTSEEING_MATCHING_PROTOTYPE }}
          projectId: sightseeing-matching-prototype
